name: CI-CD
on: 
  push:
    branches:
      - "main"
  workflow_dispatch:
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.1

      - name: "Login to Docker Hub"
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build da imagem Docker"
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            v2power/pipeline-cicd:v${{ github.run_number }}
            v2power/pipeline-cicd:latest
  CD:
    needs: [CI]
    uses: v2power/primeira-pipeline-cicd/.github/workflows/deploy.yml@main
    with:
      manifests: k8s/deployment.yaml
      images: v2power/pipeline-cicd:v${{ github.run_number }}
    secrets: inherit
