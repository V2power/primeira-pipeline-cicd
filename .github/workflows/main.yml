name: CI-CD
on: 
  push:
    branches:
      - "main"
  workflow_dispatch:
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.1
      - name: "Login to Docker Hub"
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: "Build da imagem Docker"
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            v2power/primeira-pipeline:v${{ github.run_number }}
            v2power/primeira-pipeline:latest
  CD:
    needs: [CI]
    runs-on: ubuntu-latest
    steps:
      - name: "Obtendo o código"
        uses: actions/checkout@v7.0.1
      - name: "Configurando contexto do k8s"
        uses: azure/k8s-set-context@v5
        with:
           method: kubeconfig
           kubeconfig: ${{ secrets.K8S_CONFIG }}
      - name: "Execução do manifesto"
        uses: Azure/k8s-deploy@v7
        with:
           manifests: |
              ./k8s/deployment.yaml
           images: |
             'v2power/primeira-pipeline:v${{ github.run_number }}'
