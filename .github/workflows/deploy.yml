name: Deploy K8S
on:
  workflow_call:
    inputs:
      manifests:
        type: string
        required: true
        description: "Arquivos de manifesto para deploy"
      images:
        type: string
        required: true
        description: "Images que serão alteradas nos manifestos"

jobs:
  deploy-digitalocean:
    runs-on: ubuntu-latest
    steps:
      - name: "Obtendo o código"
        uses: actions/checkout@v7.0.1

      - name: "Configurando contexto do k8s"
        uses: azure/k8s-set-context@v5
        with:
           method: kubeconfig
           kubeconfig: ${{ secrets.K8S_CONFIG }}

      - name: "Execução do manifesto"
        uses: Azure/k8s-deploy@v7
        with:
           manifests: ${{ inputs.manifests }}
           images: ${{ inputs.images }}